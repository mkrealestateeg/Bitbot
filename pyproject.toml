[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khtb-lab"
version = "0.1.0"
description = "Independent Telegram crypto trading research bot with paper trading and demo-first controls"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0.0"]
test = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
